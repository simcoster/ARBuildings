apply plugin: 'com.android.library'

// LiteRT 2.1 AAR is Java 21 bytecode (class file 65). Unity's Android JDK is 17 and
// javac 17 cannot even read those classes. Fork THIS module's javac onto a JDK 21
// install; leave Unity External Tools on the bundled 17.0.18.8 — it will refuse 21.
def jdk21Home = {
    def env = System.getenv('JDK21_HOME')
    if (env) {
        def f = file(env)
        if (f.exists()) return f
    }
    def microsoft = file('C:/Program Files/Microsoft')
    if (microsoft.exists()) {
        def hits = microsoft.listFiles()?.findAll { it.name.startsWith('jdk-21') }?.toList()
        if (hits) return hits.sort { it.name }.last()
    }
    return null
}()
if (jdk21Home == null) {
    throw new GradleException(
        'LiteRT 2.1 needs JDK 21 to compile NpuSegmenter. Install Microsoft OpenJDK 21 ' +
        '(winget install Microsoft.OpenJDK.21) or set JDK21_HOME. Do not point Unity ' +
        'External Tools at it — that knob must stay on the bundled JDK 17.')
}
logger.lifecycle("[npu] JavaCompile forked onto ${jdk21Home}")
tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.javaHome = jdk21Home
}

dependencies {
    implementation fileTree(dir: 'bin', include: ['*.jar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // LiteRT 2.1 ships org.tensorflow.lite.* itself (CPU Interpreter + CompiledModel).
    // tensorflow-lite:2.16.1 cannot sit next to it — duplicate DataType/Interpreter classes.
    implementation 'com.google.ai.edge.litert:litert:2.1.0'
}

def unityNdk = file('C:/Program Files/Unity/Hub/Editor/6000.5.7f1/Editor/Data/PlaybackEngines/AndroidPlayer/NDK')

android {
    namespace "com.pavel.arbuildings.npu"
    compileSdk 36
    buildToolsVersion "36.0.0"
    if (unityNdk.exists()) {
        ndkPath unityNdk.absolutePath
        ndkVersion "27.2.12479018"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 26
        targetSdk 36
        consumerProguardFiles 'proguard-rules.pro'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared",
                          "-DLITERT_JNI_DIR=${buildDir}/litert-native"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    lint {
        abortOnError false
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            // Default java.srcDirs is src/main/java — that is where NpuSegmenter.java lives.
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    packaging {
        jniLibs {
            pickFirsts += ['lib/arm64-v8a/libLiteRt.so',
                           'lib/arm64-v8a/libLiteRtOpenClAccelerator.so',
                           'lib/arm64-v8a/libc++_shared.so']
        }
    }
}

// Gradle 9: `implementation` is Declarable only — resolve() throws
// "Method call not allowed". A detached config is Resolvable.
tasks.register('extractLitertNative') {
    def destDir = layout.buildDirectory.dir('litert-native/arm64-v8a')
    outputs.dir(destDir)
    doLast {
        def conf = configurations.detachedConfiguration(
            dependencies.create('com.google.ai.edge.litert:litert:2.1.0')
        )
        conf.transitive = false
        def aar = conf.resolve().find { it.name.endsWith('.aar') }
        if (aar == null) {
            throw new GradleException('LiteRT 2.1.0 AAR not resolved')
        }
        copy {
            from(zipTree(aar)) {
                include 'jni/arm64-v8a/*.so'
                eachFile { f -> f.path = f.name }
                includeEmptyDirs = false
            }
            into destDir.get().asFile
        }
        logger.lifecycle("[npu] extracted LiteRT native libs from ${aar.name}")
    }
}

afterEvaluate {
    tasks.matching { it.name.toLowerCase().contains('cmake') }.configureEach {
        dependsOn 'extractLitertNative'
    }
    tasks.named('preBuild').configure { dependsOn 'extractLitertNative' }
}
